services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: tour-agency-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tour-agency-backend
    environment:
      APP_NAME: Tour Agency API
      APP_VERSION: 0.2.0
      DATABASE_URL: sqlite:////app/data/app.db
      JWT_SECRET_KEY: change-this-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      ADMIN_EMAIL: admin@example.com
      ADMIN_FULL_NAME: System Admin
      ADMIN_PHONE: "+70000000000"
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
      - "8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  backend_data:
